# Dependabot version updates for the npm workspaces (root lockfile covers
# packages/* and apps/*). Updates are grouped so routine bumps arrive as a
# couple of weekly PRs instead of one PR per package. Security updates use
# these groups too.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # Major-version upgrades are deliberately excluded: they are reviewed
      # separately (see the 2026-10-25 dependency review), not auto-proposed.
      # Security updates are unaffected by this restriction.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
